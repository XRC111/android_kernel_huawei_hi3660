name: Build Kernel (Hi3660 Pangu + KSU)

on:
  workflow_dispatch:
  push:
    branches: [ ack-test ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libncurses-dev flex bison libssl-dev libelf-dev \
            bc u-boot-tools device-tree-compiler

      - name: Generate defconfig
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make Pangu_Kirin960_defconfig
        continue-on-error: false

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # -fcommon: GCC 10+ 编译 4.9 老内核的兼容参数（默认 -fno-common 会报 multiple definition）
          make -j$(nproc) KCFLAGS=-fcommon Image

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: arch/arm64/boot/Image
          if-no-files-found: warn
