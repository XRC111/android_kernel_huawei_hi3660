name: Build Kernel (Hi3660 Pangu + KSU)

on:
  workflow_dispatch:
  push:
    branches: [ ack-test ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libncurses-dev flex bison libssl-dev libelf-dev \
            bc u-boot-tools device-tree-compiler zip

      - name: Normalize line endings (Huawei source is CRLF, Linux toolchain needs LF)
        run: |
          # 转换 kconfig/shell/perl/python/Makefile 为 LF（Kconfig 解析器对 CRLF 报错）
          find . -path './.git' -prune -o -type f \( \
            -name 'Kconfig' -o -name '*.config' -o -name '*.sh' -o \
            -name '*.pl' -o -name '*.py' -o -name 'Makefile' \) \
            -exec sed -i 's/\r$//' {} +

      - name: Generate defconfig
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make Pangu_Kirin960_defconfig
        continue-on-error: false

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # -fcommon: GCC 10+ 编译 4.9 老内核的兼容参数（默认 -fno-common 报 multiple definition）
          # -Wno-error: 老内核/华为定制代码在 GCC 11 上的 warning 不报错（VTR 用老 GCC 编译）
          # HOSTCFLAGS 用于 host 工具（scripts/dtc 等），KCFLAGS 用于内核目标
          make -j$(nproc) KCFLAGS="-fcommon -Wno-error" HOSTCFLAGS="-fcommon -Wno-error" Image

      - name: Package kernel.img
        run: |
          cp arch/arm64/boot/Image kernel.img
          zip -j kernel-pangu-h9-ksu-susfs.zip kernel.img

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel-pangu-h9-ksu-susfs.zip
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download kernel package
        uses: actions/download-artifact@v4
        with:
          name: kernel-image

      - name: Publish Release with kernel.img
        uses: softprops/action-gh-release@v2
        with:
          files: kernel-pangu-h9-ksu-susfs.zip
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
